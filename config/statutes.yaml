# Statutory constants for LA-area multifamily underwriting.
#
# EVERY value here carries its source URL and the date it was checked. These
# numbers change — annually for the adjustments, unpredictably for the rest —
# and a stale constant produces a confidently wrong valuation.
#
# If you are reading this because a number looks wrong: check `verified` first.
# Anything older than its `review_after` date should be treated as unverified.
#
# Nothing in this file is inferred. Where a figure could not be confirmed from
# a primary or reputable secondary source it is marked `unverified: true` and
# the tool refuses to rely on it silently.

meta:
  checked_by: "Jarvis (jarvis-f6) for Kash Badami"
  checked_on: "2026-09-02"

la_city_rso:
  name: "City of Los Angeles Rent Stabilization Ordinance"
  # The single most valuable field in this file. RSO status is worth roughly a
  # third of the value: Jeffrey Palmer (PMI Properties, 49 years) puts RSO
  # trading near 9x gross rent against 12x for non-RSO.
  applies_if_built_on_or_before: "1978-10-01"
  applies_if_built_on_or_before_source: "https://housing.lacity.gov/rso-rent-increase-calculator"
  allowable_increase_pct: 3.0
  allowable_increase_period: "2026-07-01 to 2027-06-30"
  allowable_increase_source: "https://housing.lacity.gov/rso-rent-increase-calculator"
  formula_range_pct: [1.0, 4.0]
  utility_surcharge_permitted: false
  utility_surcharge_note: >-
    From 2 February 2026 a landlord may no longer add a further percentage
    increase for utilities. Models built before that date over-state allowable
    increases.
  verified: "2026-09-02"
  review_after: "2027-06-30"   # the adjustment period ends

santa_monica_rso:
  name: "Santa Monica Rent Control"
  # A separate regime from LA City. Palmer calls its formula the worst in
  # California for higher-rent units, because of the dollar cap below — a
  # percentage adjustment that silently becomes a much smaller percentage
  # once the rent is high enough.
  general_adjustment_pct: 2.6
  general_adjustment_effective: "2026-09"
  dollar_cap_monthly_usd: 70
  dollar_cap_applies_at_mar_usd: 2674
  basis: >-
    75% of the change in the Los Angeles-area CPI for the 12 months ending in
    March, reported as 3.4%.
  source: "https://www.santamonica.gov/maximum-lawful-rent"
  verified: "2026-09-02"
  review_after: "2027-09-01"
  effective_pct_note: >-
    Above the cap the effective increase falls below the headline rate. At a
    $2,674 MAR the $70 cap is ~2.6% and binds exactly; at $4,000 it is ~1.75%;
    at $6,000 it is ~1.17%. Any model applying 2.6% flat over-states income on
    higher-rent units.

costa_hawkins:
  name: "Costa-Hawkins Rental Housing Act"
  # State law. Palmer's point, and it is the load-bearing one for RSO pricing:
  # a Los Angeles mayor cannot repeal it, and vacancy decontrol is what lets a
  # unit reset to market on turnover. California voters rejected statewide
  # repeal or weakening in 2018, 2020 and 2024.
  vacancy_decontrol: true
  repealable_by_city: false
  statewide_repeal_attempts_rejected: [2018, 2020, 2024]
  verified: "2026-09-02"
  review_after: "2027-01-01"

ab_1482:
  name: "AB 1482 / Tenant Protection Act"
  # Statewide backstop for property NOT covered by a local RSO. AB 1482 is a
  # FLOOR: LA City RSO and LA County RSTPO override it for covered units.
  applies_if_age_years_at_least: 15
  applies_if_age_note: >-
    Certificate of occupancy issued within the previous 15 years — a ROLLING
    window, so a building ages into coverage. Civ. Code 1947.12(d) / 1946.2(e)(7).
  applies_to_non_rso: true
  cap_formula: "5% + regional CPI change, or 10%, whichever is lower"
  cap_formula_source: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1947.12"
  la_county_current_max_pct: 8.7
  la_county_current_max_basis: "5% + 3.7% CPI, Los Angeles Metro Area"
  la_county_current_max_period: "2026-08-01 to 2027-07-31"
  la_county_current_max_source: "https://dcba.lacounty.gov/portfolio/rent-increases/"
  la_county_prior_year_pct: 8.0
  cpi_timing_rule: >-
    Increases on or after 1 August use April of the current year against April
    of the prior year; before 1 August, the two preceding Aprils.
    Civ. Code 1947.12(g)(3).
  sfr_condo_exemption: >-
    Single-family and condo units are exempt when NOT owned by a REIT,
    corporation, or an LLC with a corporate member, AND the owner has served
    the statutory written notice. Both conditions are required.
    Civ. Code 1946.2(e)(8). Do not confuse this with the separate
    owner-occupied exemptions at 1946.2(e)(5)-(6).
  sunset: "2030-01-01"
  sunset_note: "Both 1946.2 and 1947.12 are repealed as of 1 January 2030."
  verified: "2026-09-02"
  review_after: "2027-08-01"

ula:
  name: "Measure ULA transfer tax (City of Los Angeles)"
  applies_to: "City of Los Angeles only"
  # Palmer's Westchester post treats ULA as a real cost that sophisticated
  # capital underwrites around rather than avoids. Paid by the SELLER and
  # assessed on the ENTIRE consideration, not the increment above the
  # threshold — a distinction that materially changes a disposition model.
  paid_by: "seller / transferor"
  base: "entire consideration or value of the property, NOT the increment"
  tiers_fy_2026_27:
    - { from_usd: 5400000, to_usd: 10899999, rate_pct: 4.0 }
    - { from_usd: 10900000, to_usd: null, rate_pct: 5.5 }
  tiers_effective: "transactions closing after 2026-06-30"
  tiers_source: "https://finance.lacity.gov/faq/measure-ula"
  tiers_confidence: "high"
  tiers_caveat: >-
    finance.lacity.gov returns HTTP 403 to automated fetch. These figures come
    from that page's indexed text, corroborated independently by Hanson
    Bridgett (June 2026) and AAGLA. lavote.gov has NOT been updated and still
    shows the FY 2025-26 thresholds of $5.3M and $10.6M. CONFIRM IN A BROWSER
    before relying on these in a live deal.
  indexation: "annual, Chained CPI (BLS), each 1 July"
  base_dtt_la_city_pct: 0.45
  base_dtt_la_county_pct: 0.11
  base_dtt_source: "https://www.lavote.gov/home/recorder/property-document-recording/documentary-transfer-taxes/general-info"
  exemptions_note: >-
    LAMC 21.9.14, administered by LAHD. Qualifying transferees include
    501(c)(3) nonprofits, Community Land Trusts and Limited-Equity Housing
    Cooperatives with an affordable-housing experience requirement, plus
    government agencies, gifts, transfers where debt equals or exceeds value,
    bankruptcy, spousal and same-proportion entity transfers.
  exemptions_source: "https://housing.lacity.gov/ula-exemptions"
  exemptions_confidence: "medium-high — corroborated across LAHD and Hanson Bridgett; full ordinance text not read"
  verified: "2026-09-02"
  review_after: "2027-07-01"

sb_79:
  name: "SB 79 transit-oriented upzoning"
  exclusion_rule: >-
    A city may temporarily defer application where local zoning already permits
    at least 50% of the state-required density and height.
  exclusion_expires: "2030"
  worked_example: >-
    Santa Monica qualified for immediate exclusion in 6 of its 7 transit zones
    because prior upzoning along commercial corridors already supplied the
    baseline capacity, which shielded surrounding R1 lots without further
    change.
  unverified: true
  unverified_note: >-
    The mechanism above is as described by Jeffrey Palmer, who tracks this
    closely, and was NOT independently confirmed against the statute text on
    2026-09-02. Marked so it is never presented as verified.
  verified: null
  review_after: "2026-09-02"

property_tax:
  name: "LA County property tax on transfer"
  reassessed_on_change_of_ownership: true
  reassessment_source: "https://www.boe.ca.gov/proptaxes/faqs/changeinownership.htm"
  general_levy_pct: 1.0
  general_levy_plus: "voter-approved debt service for the specific tax rate area"
  general_levy_source: "https://auditor.lacounty.gov/faqs/"
  effective_rate_unverified: true
  effective_rate_note: >-
    No LA County .gov page states a typical or average total rate, and the
    machine-readable rate files are PDF/XLSX/ZIP. DO NOT publish a range.
    Pull the actual Tax Rate Area for the parcel:
    https://onlineapps.auditor.lacounty.gov/tra/
  direct_assessments_note: >-
    Direct assessments (weed removal, landscape, flood control, refuse, sewer,
    sidewalk, lighting) are property-specific, are NOT based on assessed value,
    and are added ON TOP of the ad valorem tax. A model using only a percentage
    understates the bill.
  verified: "2026-09-02"
  review_after: "2027-07-01"

underwriting:
  # Not statute — market convention, and the spread is the whole point.
  grm_rso_typical: 9.0
  grm_non_rso_typical: 12.0
  grm_source: >-
    Jeffrey Palmer, PMI Properties, LinkedIn, 26 August 2026: Hollywood RSO
    moving from ~10x into the 9x range; 1980s-90s vintage non-RSO holding near
    12x.
  grm_note: >-
    One practitioner's read of one submarket at one moment, not a published
    index. Useful as a sanity check on a computed multiplier; never as an
    input to a valuation.
  reassess_property_tax_on_sale: true
  reassess_note: >-
    California reassesses to the new purchase price on transfer. A cap rate
    computed on the seller's tax basis over-states the buyer's return, and
    Palmer states his cap rate explicitly as being after this adjustment.
  verified: "2026-09-02"
  review_after: "2027-09-02"
